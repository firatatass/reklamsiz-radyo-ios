name: ReklamsizRadyo
options:
  bundleIdPrefix: com.firatatas
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ReklamsizRadyo:
    type: application
    platform: iOS
    sources:
      - path: ReklamsizRadyo
      # MP3 kodlayıcı (LAME, LGPL). Sadece kayıtları MP3'e çevirmek için.
      - path: LAME
        compilerFlags: ["-DHAVE_CONFIG_H", "-w"]
        excludes: ["OKU.txt", "COPYING"]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.firatatas.reklamsizradyo
        PRODUCT_NAME: ReklamsizRadyo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: ReklamsizRadyo/KopruBasligi.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/LAME", "$(SRCROOT)/LAME/include", "$(SRCROOT)/LAME/libmp3lame"]
    info:
      path: ReklamsizRadyo/Info.plist
      properties:
        CFBundleDisplayName: Reklamsız Radyo
        CFBundleDevelopmentRegion: tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Sesli asistanın komutlarınızı duyabilmesi için mikrofon izni gerekir.
        NSSpeechRecognitionUsageDescription: Söylediğiniz komutları anlayabilmek için konuşma tanıma izni gerekir.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
